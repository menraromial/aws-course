# /etc/nginx/conf.d/galerie.conf : Nginx reçoit le trafic public et le relaie à Gunicorn
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name galerie;

    # plus large que la limite de l'application (10 Mo) : c'est elle qui refuse, avec un message clair
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
